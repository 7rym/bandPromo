name: "Publish release package"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish, for example v0.8.15-build-377"
        required: true
      release_name:
        description: "Human-readable release name (prefer: bandPromo v0.8.15 build 377)"
        required: true
      prerelease:
        description: "Publish as prerelease"
        required: true
        default: "false"
      draft:
        description: "Publish as draft"
        required: true
        default: "false"

permissions:
  contents: write

jobs:
  publish-release-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Seed media/icons from previous app package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/bp-app-seed
          downloaded=0
          if gh release download --repo "${{ github.repository }}" --pattern 'bandPromo.zip' --dir /tmp/bp-app-seed; then
            downloaded=1
          elif gh release download --repo "${{ github.repository }}" --pattern 'bandpromo-*.zip' --dir /tmp/bp-app-seed; then
            downloaded=1
          fi
          if [[ "$downloaded" -ne 1 ]]; then
            echo "ERROR: Could not download bandPromo.zip / bandpromo-*.zip from the latest GitHub Release."
            echo "Publish needs a previous app package to seed ignored media/icons/ before packaging."
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          seed_dir = Path("/tmp/bp-app-seed")
          zips = sorted(seed_dir.glob("bandPromo.zip")) + sorted(seed_dir.glob("bandpromo-*.zip"))
          # Prefer stable alias when present.
          alias = seed_dir / "bandPromo.zip"
          app_zip = alias if alias.is_file() else zips[-1]
          root = Path.cwd()
          extracted = 0
          with ZipFile(app_zip) as archive:
              for name in archive.namelist():
                  normalized = name.replace("\\", "/")
                  if not normalized.startswith("media/icons/"):
                      continue
                  if normalized.endswith("/"):
                      continue
                  target = root / normalized
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
                  extracted += 1
          if extracted == 0:
              raise SystemExit(f"{app_zip.name} contains no media/icons/ paths.")
          print(f"Extracted {extracted} icon paths from {app_zip.name}")
          zip_path = root / "media" / "icons" / "bP-icons.zip"
          if zip_path.is_file():
              with ZipFile(zip_path) as icons_zip:
                  icons_zip.extractall(root / "media" / "icons")
              print(f"Expanded {zip_path.name} into media/icons/")
          PY

      - name: Build distributable package with release URLs
        run: >-
          python scripts/build_release_package.py --clean
          --require-demo-manifest
          --release-tag "${{ inputs.tag_name }}"
          --package-url-base "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag_name }}"
          --manifest-url "https://github.com/${{ github.repository }}/releases/latest/download/release-manifest.json"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          draft: ${{ inputs.draft == 'true' }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          files: |
            dist/bandPromo.zip
            dist/release-manifest.json
