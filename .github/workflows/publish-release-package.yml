name: "Publish release package"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish, for example v0.8.15-build-377"
        required: true
      release_name:
        description: "Human-readable release name (prefer: bandPromo v0.8.15 build 377)"
        required: true
      prerelease:
        description: "Publish as prerelease"
        required: true
        default: "false"
      draft:
        description: "Publish as draft"
        required: true
        default: "false"

permissions:
  contents: write

jobs:
  publish-release-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify tracked install-icon seed
        run: |
          set -euo pipefail
          test -f biblioteca/templates/icons/bP-icons.zip
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          seed = Path("biblioteca/templates/icons/bP-icons.zip")
          required = {
              "apple-touch-icon.png",
              "favicon-16x16.png",
              "favicon-32x32.png",
              "favicon-96x96.png",
              "favicon.ico",
              "web-app-manifest-192x192.png",
              "web-app-manifest-512x512.png",
          }
          with ZipFile(seed) as archive:
              names = {name.replace("\\", "/").lstrip("./") for name in archive.namelist() if not name.endswith("/")}
          missing = sorted(required - names)
          if missing:
              raise SystemExit("bP-icons.zip missing required members: " + ", ".join(missing))
          print(f"Tracked icon seed OK ({seed}; {len(names)} members)")
          PY

      - name: Build distributable package with release URLs
        run: >-
          python scripts/build_release_package.py --clean
          --require-demo-manifest
          --release-tag "${{ inputs.tag_name }}"
          --package-url-base "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag_name }}"
          --manifest-url "https://github.com/${{ github.repository }}/releases/latest/download/release-manifest.json"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          draft: ${{ inputs.draft == 'true' }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          files: |
            dist/bandPromo.zip
            dist/release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
