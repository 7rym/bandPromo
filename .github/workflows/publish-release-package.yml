name: "Publish release package"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish, for example v0.7-build-246"
        required: true
      release_name:
        description: "Human-readable release name"
        required: true
      prerelease:
        description: "Publish as prerelease"
        required: true
        default: "false"
      draft:
        description: "Publish as draft"
        required: true
        default: "false"

permissions:
  contents: write

jobs:
  publish-release-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Seed media/ from latest default-theme package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/bp-theme-seed
          if ! gh release download --repo "${{ github.repository }}" --pattern 'bandpromo-default-theme-*.zip' --dir /tmp/bp-theme-seed; then
            echo "ERROR: Could not download bandpromo-default-theme-*.zip from the latest GitHub Release."
            echo "Publish needs a previous theme package to seed ignored media/ before packaging."
            exit 1
          fi
          theme_zip="$(ls /tmp/bp-theme-seed/bandpromo-default-theme-*.zip | head -n 1)"
          echo "Seeding media/ from ${theme_zip}"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import sys

          seed_dir = Path("/tmp/bp-theme-seed")
          zips = sorted(seed_dir.glob("bandpromo-default-theme-*.zip"))
          if not zips:
              raise SystemExit("No default-theme ZIP found after download.")
          theme_zip = zips[-1]
          root = Path.cwd()
          with ZipFile(theme_zip) as archive:
              members = [name for name in archive.namelist() if name.replace("\\", "/").startswith("media/")]
              if not members:
                  raise SystemExit(f"{theme_zip.name} contains no media/ paths.")
              for name in members:
                  normalized = name.replace("\\", "/")
                  if normalized.endswith("/"):
                      continue
                  target = root / normalized
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
          print(f"Extracted {len(members)} media paths from {theme_zip.name}")
          PY

      - name: Build distributable package with release URLs
        run: >-
          python scripts/build_release_package.py --clean
          --release-tag "${{ inputs.tag_name }}"
          --package-url-base "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag_name }}"
          --manifest-url "https://github.com/${{ github.repository }}/releases/latest/download/release-manifest.json"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          draft: ${{ inputs.draft == 'true' }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          files: |
            dist/*.zip
            dist/release-manifest.json
