name: "Build release package artifact"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify tracked install-icon seed
        run: |
          set -euo pipefail
          test -f biblioteca/templates/icons/bP-icons.zip
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          seed = Path("biblioteca/templates/icons/bP-icons.zip")
          required = {
              "apple-touch-icon.png",
              "favicon-16x16.png",
              "favicon-32x32.png",
              "favicon-96x96.png",
              "favicon.ico",
              "web-app-manifest-192x192.png",
              "web-app-manifest-512x512.png",
          }
          with ZipFile(seed) as archive:
              names = {name.replace("\\", "/").lstrip("./") for name in archive.namelist() if not name.endswith("/")}
          missing = sorted(required - names)
          if missing:
              raise SystemExit("bP-icons.zip missing required members: " + ", ".join(missing))
          print(f"Tracked icon seed OK ({seed}; {len(names)} members)")
          PY

      - name: Build distributable package
        run: python scripts/build_release_package.py --clean --require-demo-manifest

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandpromo-release-package
          path: |
            dist/bandPromo.zip
            dist/release-manifest.json
          if-no-files-found: error
