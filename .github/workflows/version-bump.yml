# Workflow: Validate VERSION format and local-first bumping on pushes to main.
#
# VERSION should be incremented locally before pushing to main, so the pushed commit
# already contains the build bump. CI validates that the file is present, well-formed,
# and changed in the pushed range, but it does not create follow-up commits on the branch.

name: "Validate VERSION on push"

on:
  push:
    branches:
      - main

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate VERSION file
        run: |
          if [ ! -f VERSION ]; then
            echo "VERSION file not found!" && exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          current = Path('VERSION').read_text(encoding='utf-8').strip()
          if re.fullmatch(r'v\d+\.\d+ build \d+', current) is None:
              print('VERSION file format invalid!', file=sys.stderr)
              raise SystemExit(1)
          print(f'Validated VERSION format: {current}')
          PY

          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- VERSION && {
              echo "VERSION must be bumped locally before pushing to main." && exit 1;
            }
          fi
