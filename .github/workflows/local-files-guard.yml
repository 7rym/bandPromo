name: "Guard local-only files"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  guard-local-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fail if local-only files are tracked
        shell: bash
        run: |
          set -euo pipefail

          blocked=(
            ".env"
            ".editorconfig"
            ".htaccess"
            ".user.ini"
            "FTP_PASS"
            "credentials.txt"
            "web-config.json"
            "data/pages/registry.json"
            "data/pages/bio.json"
            "data/pages/faq.json"
            "data/gallery.json"
            "biblioteca/bio.php"
            "biblioteca/gallery.json"
            "site.webmanifest"
            "play/.htaccess"
          )

          matches=()
          for p in "${blocked[@]}"; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              matches+=("$p")
            fi
          done

          for pattern in 'media/' 'data/' 'log/' 'backups/' '.vscode/'; do
            while IFS= read -r line; do
              [ -n "$line" ] && matches+=("$line")
            done < <(git ls-files "$pattern" || true)
          done

          if [ "${#matches[@]}" -gt 0 ]; then
            echo "The following local-only files are tracked and must be removed from git:"
            for m in "${matches[@]}"; do
              echo " - $m"
            done
            echo "Use: git rm --cached <file> to untrack while keeping local files."
            echo "Runtime trees (data/, log/, backups/, media/) and IDE prefs (.vscode/, .editorconfig) must stay untracked."
            echo "Apache/PHP stubs are generated from biblioteca/templates/runtime/ by setup."
            exit 1
          fi

          echo "No tracked local-only files found."
