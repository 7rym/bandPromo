name: "Guard local-only files"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  guard-local-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fail if local-only files are tracked
        shell: bash
        run: |
          set -euo pipefail

          blocked=(
            ".env"
            "FTP_PASS"
            "credentials.txt"
            "web-config.json"
            "data/bio.html"
            "data/gallery.json"
            "biblioteca/bio.php"
            "biblioteca/gallery.json"
            "site.webmanifest"
          )

          matches=()
          for p in "${blocked[@]}"; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              matches+=("$p")
            fi
          done

          icon_matches=$(git ls-files "media/icons/*" | grep -v '^media/icons/bP-icons.zip$' || true)
          if [ -n "$icon_matches" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && matches+=("$line")
            done <<< "$icon_matches"
          fi

          if [ "${#matches[@]}" -gt 0 ]; then
            echo "The following local-only files are tracked and must be removed from git:"
            for m in "${matches[@]}"; do
              echo " - $m"
            done
            echo "Use: git rm --cached <file> to untrack while keeping local files."
            exit 1
          fi

          echo "No tracked local-only files found."
